<!-- /share-your-story page code (Page settings > Before </body>). Checks the action is done (HF.sync, backend-backed), then fills the native Webflow story form (story-action, story-name, story-email). Keep in sync with Webflow. -->
<script>(async function(){function $(i){return document.getElementById(i)}function wait(k,ms){return new Promise(function(r){var t0=Date.now();(function c(){window[k]?r(true):Date.now()-t0>ms?r(false):setTimeout(c,50)})()})}var fa=$('story-action'),f=fa&&fa.closest('form');if(!f)return;f.querySelectorAll('[placeholder="Example text"]').forEach(function(e){e.placeholder=''});if($('story-text')){$('story-text').placeholder='What did you do, and how did they react?'}if($('story-link')){$('story-link').placeholder='https://'}var box=f.closest('.w-form')||f,note=$('hf-story-note');box.style.display='none';function say(t,l,h,fn){note.textContent=t;var row=document.createElement('span');row.className='hf-button-row';var a=document.createElement('a');a.textContent=l;a.href=h;a.className='hf-button';if(fn){a.addEventListener('click',function(e){e.preventDefault();fn()})}row.appendChild(a);note.appendChild(row)}await wait('HF',10000);await wait('HFB',10000);if(HF.finish){await HF.finish()}var back=location.pathname+location.search;if(!HF.token()){return say('Sign in to share your story. It is free.','Sign in','/account',function(){window.HFB?HFB.requireSignIn({kind:'return',returnTo:back}):HF.signin()})}var c=window.HFB?await HFB.sync():await HF.sync();if(!c){return say('We could not load your account. Please try again.','Reload',back)}var slug=new URLSearchParams(location.search).get('action')||'';var done=(c.actions||[]).some(function(d){return d.idea===slug});if(!slug||!done){return say('Stories are shared from an action you have taken.','Go to your account','/account')}var title=slug.replace(/-/g,' ');try{var h=await fetch('/action/'+slug).then(function(r){return r.ok?r.text():''});var t=new DOMParser().parseFromString(h,'text/html').querySelector('h1');if(t&&t.textContent.trim()){title=t.textContent.trim()}}catch(e){}fa.value=title;fa.readOnly=true;if(c.firstName){$('story-name').value=c.firstName}try{var q=await HF.api('{customer{emailAddress{emailAddress}}}');var em=q.data.customer.emailAddress.emailAddress;if(em){$('story-email').value=em;$('story-email').readOnly=true}}catch(e){}box.style.display=''})();</script>
