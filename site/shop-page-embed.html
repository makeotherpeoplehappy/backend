<!-- /shop page embed: Shopify Storefront Web Components product grid. The cart (#hf-cart) is opened from the header. Keep in sync with Webflow. -->
<div id="hf-shop"></div><style>.hf-shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;margin-top:24px}.hf-product{display:flex;flex-direction:column;padding:16px;border:2px solid #222;border-radius:12px}.hf-product[data-handle="test-product-to-be-removed"]{display:none}.hf-product-media{display:block;aspect-ratio:1/1;border-radius:8px;background:#eee;overflow:hidden}.hf-product-media img{display:block;width:100%;height:100%;object-fit:cover}.hf-product h2{margin:16px 0 4px;font-size:22px;line-height:1.25}.hf-product h2 a{color:#222;text-decoration:none}.hf-product h2 a:hover{text-decoration:underline}.hf-product .hf-price{margin:0 0 16px;font-size:18px;color:#444}.hf-product .hf-button-row{margin-top:auto}.hf-product button[disabled]{display:none}</style><script>(function(){var s=document.createElement('script');s.type='module';s.src='https://cdn.shopify.com/storefront/web-components.js';document.head.appendChild(s);document.getElementById('hf-shop').innerHTML=`<shopify-store store-domain="r40e0y-zs.myshopify.com" country="US" language="en"></shopify-store><shopify-cart id="hf-cart"></shopify-cart><div class="hf-shop-grid"><shopify-list-context type="product" query="products" first="24"><template><div class="hf-product" shopify-attr--data-handle="product.handle"><a class="hf-product-media" href="#" shopify-attr--data-handle="product.handle" onclick="event.preventDefault();location.href='/products/'+this.dataset.handle"><shopify-media query="product.selectedOrFirstAvailableVariant.image" width="480" height="480"></shopify-media></a><h2><a href="#" shopify-attr--data-handle="product.handle" onclick="event.preventDefault();location.href='/products/'+this.dataset.handle"><shopify-data query="product.title"></shopify-data></a></h2><p class="hf-price"><shopify-money query="product.selectedOrFirstAvailableVariant.price"></shopify-money></p><div class="hf-button-row"><button type="button" class="hf-button-light" shopify-attr--data-handle="product.handle" onclick="location.href='/products/'+this.dataset.handle">Details</button><button type="button" class="hf-button" onclick="document.getElementById('hf-cart').addLine(event).showModal()" shopify-attr--disabled="!product.selectedOrFirstAvailableVariant.availableForSale">Add to cart</button></div></div></template></shopify-list-context></div>`;})();</script>
