<!-- Action finder component (home and /actions): styles, the "Near you" card and the sentence filter logic. Keep in sync with Webflow. Style overrides from the 15 Nov UX pass live in site/site-head.html. -->
<style>.hf-lead{font-size:20px;color:#444}.hf-label{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#666;margin-bottom:12px}#hf-now,#hf-surprise{font-size:17px;padding:10px 18px;border:2px solid #222;border-radius:999px;background:#fff;color:#222;cursor:pointer}.hf-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hf-card{border:2px solid #222;border-radius:12px;padding:20px;margin:16px 0}.hf-row .hf-card{margin:0}.hf-h3{font-size:20px;font-weight:700}.hf-card button{margin-top:12px}.hf-chips{margin:24px 0}.hf-chips a{display:inline-block;border:2px solid #222;border-radius:999px;padding:6px 14px;margin:0 8px 8px 0;text-decoration:none;color:#222}.w-dyn-item{margin:14px 0}.w-dyn-item p{margin:2px 0 0;color:#444}@media(max-width:767px){.hf-row{grid-template-columns:1fr}}</style><div id="hf-local" class="hf-card" style="display:none"></div><script>(function(){var T=[['any amount of time',1e9],['1 minute',1],['5 minutes',5],['15 minutes',15],['30 minutes',30],['1 hour',60],['2 hours',120],['half a day',240],['1 day',1440],['1 week',10080]];var C=[['any budget',1e9],['$0',0],['up to $5',5],['up to $10',10],['up to $50',50],['up to $100',100],['up to $500',500],['up to $1,000',1000],['up to $5,000',5000]];var K=['with','occasion','where','type','who'];var SUB={with:1,where:1,type:1};var LB={who:'someone',where:'anywhere',type:'in any way',with:'alone or with others'};var OL=[['just because','just because'],['birthday','on their birthday'],['holidays','over the holidays'],['celebration','because there is something to celebrate'],['congratulations','because they achieved something'],['thank you','because they helped me'],['welcome','because they are new'],['goodbye','because they are leaving'],['missing you','because I miss them'],['tough day','because they are having a tough day'],['get well','because they are unwell'],['sorry','because I let them down']];var WL={child:'a child',colleague:'a colleague',community:'my community',family:'my family',friend:'a friend',grandparent:'a grandparent',neighbor:'a neighbor',parent:'a parent',partner:'my partner',stranger:'a stranger',teacher:'a teacher'};var PL={'southampton-ny':'The Hamptons',copenhagen:'Copenhagen'};var shown=false,lim=10;['hf-more','hf-showmore'].forEach(function(i){var e=document.getElementById(i);if(e){e.style.display='none'}});function fill(s,a){a.forEach(function(o){var e=document.createElement('option');e.textContent=o[0];e.value=o[1];s.appendChild(e)})}function init(){var st=document.getElementById('hf-time'),sc=document.getElementById('hf-cost'),cnt=document.getElementById('hf-count'),more=document.getElementById('hf-more'),res=document.getElementById('hf-results'),lc=document.getElementById('hf-local');if(!st)return;var ff=document.getElementById('hf-filter');if(ff){ff.addEventListener('submit',function(e){e.preventDefault()})}function loc(){var s=localStorage.getItem('hf_loc');if(s&&PL[s]){lc.innerHTML='<div class="hf-label">Near you</div><a class="hf-h3" href="/actions-in/'+s+'">Local actions in '+PL[s]+'</a>';lc.style.display=''}else{lc.style.display='none'}}window.addEventListener('hf-loc',loc);loc();st.innerHTML='';sc.innerHTML='';fill(st,T);fill(sc,C);var tm={};T.forEach(function(o){tm[o[0]]=o[1]});var items=[];document.querySelectorAll('.w-dyn-item').forEach(function(it){var a=it.querySelector(':scope > a[href^="/action/"]');var d=it.querySelectorAll(':scope > div');if(!a||!d.length)return;var t=tm[(d[0]?d[0].textContent:'').trim().toLowerCase()]||0;var ct=(d[1]?d[1].textContent:'').replace(/[^0-9]/g,'');var c=ct?parseInt(ct,10):0;var L=it.querySelectorAll(':scope > .w-dyn-list');var g={};K.forEach(function(k,j){g[k]=[];if(L[j]){L[j].querySelectorAll('.w-dyn-item').forEach(function(n){var x=n.textContent.trim().toLowerCase();if(x){g[k].push(x)}})}});items.push({el:it,a:a,t:t,c:c,g:g});it.style.display='none'});if(!items.length)return;var h=[].slice.call(document.querySelectorAll('h2')).filter(function(x){return /Action of the month/.test(x.textContent)})[0];if(h&&h.nextElementSibling){var cw=document.createElement('div');cw.className='hf-card';h.parentNode.insertBefore(cw,h);var lb=document.createElement('div');lb.className='hf-label';lb.textContent='Action of the month';cw.appendChild(lb);var w2=h.nextElementSibling;cw.appendChild(w2);h.remove();var ml=w2.querySelector('a[href^="/action/"]');if(ml){ml.className='hf-h3';var mi=items.filter(function(i){return i.a.getAttribute('href')===ml.getAttribute('href')})[0];var mp=mi&&mi.el.querySelector('p');if(mp){var d2=document.createElement('div');d2.textContent=mp.textContent;ml.parentNode.appendChild(d2)}}}var par=items[0].el.parentNode;items.sort(function(a,b){return a.t-b.t});items.forEach(function(i){par.appendChild(i.el)});var mb=document.getElementById('hf-showmore')||document.createElement('a');mb.style.display='none';var lw=par.closest('.w-dyn-list')||par;if(res){if(mb.parentNode===res){res.insertBefore(lw,mb)}else{res.appendChild(lw)}}var sel={};K.forEach(function(k){sel[k]=document.getElementById('hf-'+k)});function match(i,skip){return i.t<=+st.value&&i.c<=+sc.value&&K.every(function(k){if(k===skip)return true;var v=sel[k].value;return !v||i.g[k].indexOf(v)>-1})}function run(){var again=false;K.forEach(function(k){var av={};items.forEach(function(i){if(match(i,k)){i.g[k].forEach(function(x){av[x]=1})}});var cur=sel[k].value;sel[k].innerHTML='';if(k==='occasion'){var op=OL.filter(function(o){return av[o[0]]}).map(function(o){return[o[1],o[0]]});if(!cur||!av[cur]){var nc=av['just because']?'just because':(op[0]?op[0][1]:'');if(nc!==cur){cur=nc;again=true}}fill(sel[k],op);sel[k].value=cur;return}if(cur&&!av[cur]){cur='';again=true}var ks=Object.keys(av).sort();fill(sel[k],[[LB[k],'']].concat(ks.map(function(x){return[(k==='who'&&WL[x])||x,x]})));sel[k].value=cur;if(SUB[k]){sel[k].style.display=(ks.length>1||cur)?'':'none'}});if(again){return run()}var n=0;items.forEach(function(i){var ok=match(i);if(ok)n++;i.el.style.display=(shown&&ok&&n<=lim)?'':'none'});cnt.textContent=shown?n+(n===1?' action':' actions'):'';more.style.display=shown?'':'none';mb.style.display=(shown&&n>lim)?'':'none'}[st,sc].concat(K.map(function(k){return sel[k]})).forEach(function(s){s.addEventListener('change',function(){lim=10;run()})});document.getElementById('hf-show').addEventListener('click',function(e){e.preventDefault();shown=true;run()});mb.addEventListener('click',function(e){e.preventDefault();lim+=10;run()});(document.getElementById('hf-now')||document.createElement('b')).addEventListener('click',function(){st.value=15;sc.value=0;shown=true;lim=10;run();st.scrollIntoView({behavior:'smooth',block:'center'})});(document.getElementById('hf-surprise')||document.createElement('b')).addEventListener('click',function(){var v=items.filter(function(i){return match(i)});if(v.length){location.href=v[Math.floor(Math.random()*v.length)].a.href}});run();setTimeout(function(){if(!window.HF||!HF.token())return;HF.load().then(function(c){if(!c)return;var d=[];try{d=JSON.parse((c.metafield&&c.metafield.value)||'[]')}catch(e){}var s={};d.forEach(function(x){s[x.idea]=1});items.forEach(function(i){if(s[i.a.getAttribute('href').split('/').pop()]){var m=document.createElement('span');m.textContent=' Done';i.a.parentNode.insertBefore(m,i.a.nextSibling)}})})},1000)}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}})();</script>
