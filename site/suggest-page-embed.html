<!-- /suggest-an-action embed: shows the native form to signed-in members, prefills name and email, saves the idea to the customer's "suggestions" metafield, then submits the Webflow form. Keep in sync with Webflow. -->
<script>(async function(){function wait(){return new Promise(function(r){(function c(){window.HF?r():setTimeout(c,50)})()})}var f=document.getElementById('wf-form-Suggest-an-action');if(!f)return;var w=f.closest('.w-form');w.style.display='none';await wait();function out(){var o=document.createElement('div');o.innerHTML='<p>Sign in to send a suggestion. It is free.</p><a class="hf-button" href="/account">Sign in</a>';w.parentNode.insertBefore(o,w)}if(!HF.token()){return out()}var j=await HF.api('{customer{firstName lastName emailAddress{emailAddress}}}');var c=j&&j.data&&j.data.customer;if(!c){return out()}w.style.display='';var n=f.querySelector('input[type="text"]'),e=f.querySelector('input[type="email"]');if(n&&(c.firstName||c.lastName)){n.value=[c.firstName,c.lastName].filter(Boolean).join(' ')}if(e&&c.emailAddress){e.value=c.emailAddress.emailAddress;e.readOnly=true}var saved=false;f.addEventListener('submit',async function(ev){if(saved)return;ev.preventDefault();ev.stopImmediatePropagation();var t=f.querySelector('textarea').value.trim();if(!t)return;var q=await HF.api('{customer{id metafield(namespace:"custom",key:"suggestions"){value}}}');var cu=q&&q.data&&q.data.customer;if(!cu){alert('Please sign in again.');return}var list=[];try{list=JSON.parse((cu.metafield&&cu.metafield.value)||'[]')}catch(x){}list.push({idea:t,date:new Date().toISOString()});var r=await HF.api('mutation($m:[MetafieldsSetInput!]!){metafieldsSet(metafields:$m){userErrors{message}}}',{m:[{ownerId:cu.id,namespace:'custom',key:'suggestions',type:'json',value:JSON.stringify(list)}]});var er=r&&r.data&&r.data.metafieldsSet&&r.data.metafieldsSet.userErrors;if(!r||!r.data||(er&&er.length)){alert('Sorry, that did not save. Please try again.');return}saved=true;f.requestSubmit()},true)})();</script>
