<!-- /account embed: name, tally, "Saved for later" (from /api/me saved, via HF.sync), done list with "Share your story", orders and pledges (computed in the browser until Phase 3). Keep in sync with Webflow. -->
<script>(async function(){function $(i){return document.getElementById(i)}function wait(){return new Promise(function(r){(function c(){window.HF?r():setTimeout(c,50)})()})}await wait();var out=$('hf-acct-out'),inn=$('hf-acct-in');$('hf-signin').addEventListener('click',function(){HF.signin()});$('hf-signout').addEventListener('click',function(e){e.preventDefault();HF.signout()});await HF.finish();if(!HF.token())return;var c=await HF.sync();if(!c)return;out.style.display='none';inn.style.display='block';if(c.firstName){$('hf-name').textContent=c.firstName}function nm(d){return d.title||String(d.idea||d.slug).replace(/-/g,' ')}var a=c.actions||[];$('hf-tally').textContent=a.length;var sv=c.saved||[],ah=$('hf-actions');if(sv.length&&ah&&!$('hf-saved')){var h=document.createElement('h2');h.textContent='Saved for later';var box=document.createElement('div');box.id='hf-saved';sv.forEach(function(d){var it=document.createElement('div');it.className='hf-list-item';var k=document.createElement('a');k.className='hf-list-link';k.href='/action/'+d.slug;k.textContent=nm(d);it.appendChild(k);box.appendChild(it)});var ref=ah.previousElementSibling;ref.parentNode.insertBefore(h,ref);ref.parentNode.insertBefore(box,ref)}if(a.length){var ul=document.createElement('ul');a.slice().reverse().forEach(function(d){var li=document.createElement('li');var k=document.createElement('a');k.href='/action/'+d.idea;k.textContent=nm(d);li.appendChild(k);if(d.date){li.appendChild(document.createTextNode(' - '+new Date(d.date).toLocaleDateString()))}li.appendChild(document.createTextNode(' - '));var s=document.createElement('a');s.href='/share-your-story?action='+encodeURIComponent(d.idea);s.textContent='Share your story';s.className='hf-story-link';li.appendChild(s);ul.appendChild(li)});ah.innerHTML='';ah.appendChild(ul)}var o=(c.orders&&c.orders.nodes)||[];if(o.length){var ol=document.createElement('ul');o.forEach(function(x){var li=document.createElement('li');li.textContent=x.name+' - '+new Date(x.processedAt).toLocaleDateString()+' - '+x.totalPrice.amount+' '+x.totalPrice.currencyCode;ol.appendChild(li)});$('hf-orders').innerHTML='';$('hf-orders').appendChild(ol)}var pl=$('hf-pledges');if(pl&&o.length){var used={};var acts=a.filter(function(d){return d.date}).sort(function(x,y){return new Date(x.date)-new Date(y.date)});var ords=o.slice().sort(function(x,y){return new Date(x.processedAt)-new Date(y.processedAt)});var rows=ords.map(function(x){var t=new Date(x.processedAt).getTime(),kept=null;for(var i=0;i<acts.length;i++){if(!used[i]&&new Date(acts[i].date).getTime()>=t){used[i]=1;kept=acts[i];break}}return{o:x,k:kept}});var pu=document.createElement('ul');rows.reverse().forEach(function(r){var li=document.createElement('li');li.appendChild(document.createTextNode('Pledged '+new Date(r.o.processedAt).toLocaleDateString()+' with order '+r.o.name+' - '));if(r.k){li.appendChild(document.createTextNode('Kept: '));var ka=document.createElement('a');ka.href='/action/'+r.k.idea;ka.textContent=nm(r.k);li.appendChild(ka);li.appendChild(document.createTextNode(' on '+new Date(r.k.date).toLocaleDateString()))}else{li.appendChild(document.createTextNode('Open. '));var fa=document.createElement('a');fa.href='/actions';fa.textContent='Find an action';li.appendChild(fa)}pu.appendChild(li)});pl.innerHTML='';pl.appendChild(pu)}})();</script>
