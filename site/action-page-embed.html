<script>
// Action page: "I did this", "Like this", "Share your story" and "Do this
// with me", all through the backend at /join. Pasted into the HTML embed on
// the Actions Template in Webflow. Keep this copy in sync with the site.
(async function(){
function $(i){return document.getElementById(i)}
function wait(t,ms){return new Promise(function(r){var s=Date.now();(function c(){if(t())return r(true);if(Date.now()-s>ms)return r(false);setTimeout(c,50)})()})}
var btn=$('hf-did-this'),msg=$('hf-did-msg'),pr=$('hf-signup-prompt');if(!btn)return;
var slug=location.pathname.split('/').filter(Boolean).pop();
msg.setAttribute('role','status');msg.setAttribute('aria-live','polite');
var lo=document.createElement('button');lo.type='button';lo.textContent='Like this';lo.setAttribute('aria-pressed','false');
var wrap=document.createElement('p');wrap.appendChild(lo);pr.parentNode.insertBefore(wrap,pr);
var sh=document.createElement('a');sh.href='/share-your-story?action='+encodeURIComponent(slug);sh.textContent='Share your story';sh.className='hf-story-link';
var shp=document.createElement('p');shp.style.display='none';shp.appendChild(sh);pr.parentNode.insertBefore(shp,wrap);
var jb=document.createElement('a');jb.href='#';jb.textContent='Do this with me';jb.className='hf-button-light';
var jp=document.createElement('p'),jm=document.createElement('span');jm.setAttribute('role','status');jp.style.display='none';
jp.appendChild(jb);jp.appendChild(document.createTextNode(' '));jp.appendChild(jm);pr.parentNode.insertBefore(jp,shp);
await wait(function(){return window.HFB&&window.HF},10000);if(!window.HFB)return;
var st={},id=null;
function signedIn(){return !!(HF.token&&HF.token())}
function say(t){msg.textContent=t}
function render(){var me=st.me;
if(me&&me.done){btn.textContent='Done';btn.disabled=true;say('You have made '+me.tally+' '+(me.tally===1?'person':'people')+' happy.');shp.style.display=''}
lo.textContent=me&&me.liked?'You like this':'Like this';lo.setAttribute('aria-pressed',me&&me.liked?'true':'false');
if(st.canDoWithOthers)jp.style.display=''}
async function load(){var r=await HFB.call('/api/actions/'+encodeURIComponent(slug)+'/state');if(r.ok){st=r.data;id=st.actionId;render()}}
await load();
function ask(kind){pr.textContent='';var b=document.createElement('button');b.type='button';b.textContent='Sign in to save this';
b.onclick=function(){HFB.requireSignIn({kind:kind,actionId:id})};pr.appendChild(b);pr.style.display='block';b.focus()}
var busy=false;
btn.addEventListener('click',async function(e){e.preventDefault();if(busy||!id||(st.me&&st.me.done))return;if(!signedIn())return ask('done');
busy=true;btn.setAttribute('aria-busy','true');var r=await HFB.call('/api/actions/'+id+'/done',{method:'POST',key:HFB.newKey()});busy=false;btn.removeAttribute('aria-busy');
if(r.ok){st.me=Object.assign({},st.me,{done:true,tally:r.data.tally});render()}else if(r.status===401){ask('done')}else{say((r.data&&r.data.message)||'Something went wrong. Please try again.')}});
var lbusy=false;
lo.addEventListener('click',async function(){if(lbusy||!id)return;if(!signedIn())return ask('like');
lbusy=true;var want=!(st.me&&st.me.liked);var r=await HFB.call('/api/actions/'+id+'/like',{method:'PUT',body:{liked:want},key:HFB.newKey()});lbusy=false;
if(r.ok){st.me=Object.assign({},st.me,{liked:want});render()}else if(r.status===401){ask('like')}else{say((r.data&&r.data.message)||'Something went wrong. Please try again.')}});
jb.addEventListener('click',async function(e){e.preventDefault();var c=signedIn()&&HF.load?await HF.load():null;var nm=(c&&c.firstName)||'';
var u=location.origin+'/do-this-with-me?action='+encodeURIComponent(slug)+(nm?'#'+encodeURIComponent(nm):'');var ti=((document.querySelector('h1')||{}).textContent||'').trim();
if(navigator.share){navigator.share({title:ti,text:'Do this with me: '+ti,url:u}).catch(function(){})}
else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){jm.textContent='Link copied. Send it to the person you want to do this with.'})}else{jm.textContent=u}});
document.addEventListener('hfb:resumed',function(){load()});
})();
</script>
