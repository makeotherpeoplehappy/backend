# The 5-minute timer for the Make Other People Happy backend.
# Deploy: cd timer && npx wrangler deploy
name = "hf-timer"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
JOBS_URL = "https://www.makeotherpeoplehappy.com/join/api/jobs/tick"
JOBS_FALLBACK_URL = "https://happiness-foundation.webflow.io/join/api/jobs/tick"

[observability]
enabled = true
