<!-- Products Template embed: live price, variants and Add to cart (Shopify Storefront Web Components), plus Product JSON-LD. Sits right under the title. Keep in sync with Webflow. -->
<style>.hf-product-price{margin:4px 0 12px;font-size:24px;font-weight:500}#hf-product .hf-button-row{margin-top:16px}#hf-product button[disabled]{display:none}</style><div id="hf-product"></div><script>(function(){var D='r40e0y-zs.myshopify.com';var h=location.pathname.split('/').filter(Boolean).pop();var s=document.createElement('script');s.type='module';s.src='https://cdn.shopify.com/storefront/web-components.js';document.head.appendChild(s);var img=document.querySelector('h1 ~ img[src]:not(.w-dyn-bind-empty)');var media=img?'':'<shopify-media query="product.selectedOrFirstAvailableVariant.image" width="400" height="400"></shopify-media>';document.getElementById('hf-product').innerHTML=`<shopify-store store-domain="${D}" country="US" language="en"></shopify-store><shopify-cart id="hf-cart"></shopify-cart><shopify-context type="product" handle="${h}"><template>${media}<p class="hf-product-price"><shopify-money query="product.selectedOrFirstAvailableVariant.price"></shopify-money></p><shopify-variant-selector></shopify-variant-selector><div class="hf-button-row"><button type="button" class="hf-button" onclick="document.getElementById('hf-cart').addLine(event).showModal()" shopify-attr--disabled="!product.selectedOrFirstAvailableVariant.availableForSale">Add to cart</button></div></template></shopify-context>`;fetch('https://'+D+'/api/2026-01/graphql.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'query($h:String!){product(handle:$h){title description featuredImage{url} variants(first:1){nodes{availableForSale price{amount currencyCode}}}}}',variables:{h:h}})}).then(function(r){return r.json()}).then(function(j){var p=j&&j.data&&j.data.product;if(!p)return;var v=p.variants.nodes[0];var h1=document.querySelector('h1');var ld={'@context':'https://schema.org','@type':'Product',name:h1?h1.textContent.trim():p.title,description:p.description,image:img?img.src:(p.featuredImage?p.featuredImage.url:undefined),brand:{'@type':'Brand',name:'Make Other People Happy'},offers:{'@type':'Offer',url:location.origin+location.pathname,price:v.price.amount,priceCurrency:v.price.currencyCode,availability:'https://schema.org/'+(v.availableForSale?'InStock':'OutOfStock')}};var e=document.createElement('script');e.type='application/ld+json';e.textContent=JSON.stringify(ld);document.head.appendChild(e)}).catch(function(){})})();</script>
